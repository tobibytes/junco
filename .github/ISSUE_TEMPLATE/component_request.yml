name: Component, block or page request
description: Ask for something new in the catalog.
labels: [new-component, triage]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind?
      options: [Component, Block, Page, Template, Motion effect, 3D scene]
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Date picker
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Where would you use it?
      description: A real project or screen makes it much more likely to ship sooner.
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Links or screenshots of versions you like.
