name: Deploy MCP server

# main -> the remote MCP server at https://mcp.junco.madebytobi.com/mcp (Cloudflare Worker
# junco-mcp). Runs when the server, the Worker or the tokens it bundles change.
on:
  push:
    branches: [main]
    paths:
      - "packages/mcp/**"
      - "packages/tokens/**"
      - "apps/mcp-worker/**"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build and test the Worker (and the packages it uses)
        run: pnpm turbo run build test --filter=mcp-worker...

      - name: Deploy to Cloudflare Workers
        working-directory: apps/mcp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Check the live endpoint answers MCP
        run: |
          for i in $(seq 1 10); do
            body=$(curl -sS -X POST https://mcp.junco.madebytobi.com/mcp \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' || true)
            if echo "$body" | grep -q '"name":"junco"'; then echo "MCP initialize OK"; exit 0; fi
            sleep 5
          done
          echo "The deployed server didn't answer initialize: $body"
          exit 1
