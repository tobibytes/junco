name: Deploy collaboration demo auth

on:
  push:
    branches: [main]
    paths:
      - "apps/collab-auth/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-collab-auth.yml"
  workflow_dispatch:

concurrency:
  group: deploy-collab-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVEBLOCKS_SECRET_KEY: ${{ secrets.LIVEBLOCKS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add CLOUDFLARE_API_TOKEN to repository Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."; exit 1; }
      - name: Report missing Liveblocks key
        if: env.LIVEBLOCKS_SECRET_KEY == ''
        run: echo "::notice::Set the LIVEBLOCKS_SECRET_KEY Actions secret to activate the hosted demo room. Worker deployment is skipped."
      - name: Set encrypted Liveblocks secret
        if: env.LIVEBLOCKS_SECRET_KEY != ''
        working-directory: apps/collab-auth
        run: printf '%s' "$LIVEBLOCKS_SECRET_KEY" | pnpm exec wrangler secret put LIVEBLOCKS_SECRET_KEY
      - name: Build Worker
        if: env.LIVEBLOCKS_SECRET_KEY != ''
        working-directory: apps/collab-auth
        run: pnpm exec wrangler deploy --dry-run
      - name: Deploy Worker
        if: env.LIVEBLOCKS_SECRET_KEY != ''
        working-directory: apps/collab-auth
        run: pnpm exec wrangler deploy
      - name: Check health endpoint
        if: env.LIVEBLOCKS_SECRET_KEY != ''
        run: curl --fail --silent --show-error https://collab-auth.junco.madebytobi.com/health
