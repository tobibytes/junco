name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  PROJECT_NAME: junco-docs
  CUSTOM_DOMAIN: junco.madebytobi.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the site (and the packages it uses)
        run: pnpm turbo run build --filter=docs...

      # First deploy only: the project may not exist yet. Fails harmlessly when it does.
      - name: Create the Pages project if missing
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages project create "$PROJECT_NAME" --production-branch main || echo "Project exists, continuing"

      - name: Deploy to Cloudflare Pages
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy out --project-name "$PROJECT_NAME" --branch main

      # Idempotent: an "already exists" answer from the API counts as success.
      - name: Attach the custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${CUSTOM_DOMAIN}\"}")
          if echo "$response" | grep -q '"success":true'; then
            echo "Attached ${CUSTOM_DOMAIN}"
          elif echo "$response" | grep -qi 'already exists\|already added\|already in use by this project'; then
            echo "${CUSTOM_DOMAIN} already attached"
          else
            echo "Could not attach ${CUSTOM_DOMAIN}:"
            echo "$response"
            exit 1
          fi
