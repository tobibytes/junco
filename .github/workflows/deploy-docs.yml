name: Deploy docs

# main -> production at junco.madebytobi.com.
# Pull requests from this repo -> a preview URL, posted as a comment on the PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_NAME: junco-docs
  CUSTOM_DOMAIN: junco.madebytobi.com

jobs:
  deploy:
    # Fork PRs don't get the Cloudflare secrets, so only same-repo PRs get previews.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      IS_PREVIEW: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the site (and the packages it uses)
        run: pnpm turbo run build --filter=docs...

      # First deploy only: the project may not exist yet. Fails harmlessly when it does.
      - name: Create the Pages project if missing
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages project create "$PROJECT_NAME" --production-branch main || echo "Project exists, continuing"

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ "$IS_PREVIEW" = "true" ]; then
            # Cloudflare branch aliases allow lowercase letters, digits and dashes.
            branch=$(echo "pr-${{ github.event.pull_request.number }}" | tr -c 'a-z0-9-\n' '-')
          else
            branch=main
          fi
          pnpm exec wrangler pages deploy out --project-name "$PROJECT_NAME" --branch "$branch" --commit-dirty=true | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=https://${branch}.${PROJECT_NAME}.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Comment the preview link on the PR
        if: env.IS_PREVIEW == 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.alias }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- junco-docs-preview -->";
            const body = `${marker}\n**Docs preview:** ${process.env.PREVIEW_URL}\n\nThis deploy: ${process.env.DEPLOY_URL} (commit ${context.sha.slice(0, 7)}). Updates on every push to this PR.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      # Idempotent: an "already exists" answer from the API counts as success.
      - name: Attach the custom domain
        if: env.IS_PREVIEW != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${CUSTOM_DOMAIN}\"}")
          if echo "$response" | grep -q '"success":true'; then
            echo "Attached ${CUSTOM_DOMAIN}"
          elif echo "$response" | grep -qi 'already exists\|already added\|already in use by this project'; then
            echo "${CUSTOM_DOMAIN} already attached"
          else
            echo "Could not attach ${CUSTOM_DOMAIN}:"
            echo "$response"
            exit 1
          fi
