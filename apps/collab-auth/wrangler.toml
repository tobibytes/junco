name = "junco-collab-demo-auth"
main = "src/index.ts"
compatibility_date = "2026-10-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[routes]]
pattern = "collab-auth.junco.madebytobi.com"
custom_domain = true

[vars]
ROOM_ID = "junco:collaboration-demo"
ALLOWED_ORIGINS = "https://junco.madebytobi.com"

[secrets]
required = ["LIVEBLOCKS_SECRET_KEY"]
