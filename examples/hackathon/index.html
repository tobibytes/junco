<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HackHarbor 2027: 36 hours to build something real</title>
    <meta name="description" content="HackHarbor is a 36-hour student hackathon in Seattle. Free to attend, open to every major. A Junco example." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Same as junco's themeScript(): applies the saved theme before first paint. -->
    <script>
      (function(k,t,m){try{var s=localStorage;t=s.getItem(k+"-theme")||t;m=s.getItem(k+"-motion")||m}catch(e){}var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches),r=d?"dark":"light",e=document.documentElement;e.classList.toggle("dark",d);e.dataset.theme=r;e.dataset.motion=m;e.style.colorScheme=r})("hackharbor","system","full")
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
