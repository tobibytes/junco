<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Junco semantic classes</title>
    <!-- Rebuild junco.css from the repo root: pnpm css:example -->
    <link rel="stylesheet" href="./junco.css" />
  </head>
  <body style="padding: 40px; display: grid; gap: 16px; max-width: 560px">
    <div class="card">
      <h2 style="margin: 0 0 4px; font-size: 16px">Semantic classes</h2>
      <p style="margin: 0 0 16px; color: var(--muted-foreground)">Plain HTML, no JavaScript.</p>
      <input class="input" placeholder="you@example.com" />
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px">
        <button class="btn btn-primary">Save</button>
        <button class="btn">Cancel</button>
        <button class="btn btn-ghost">More</button>
        <span class="badge">Beta</span>
      </div>
    </div>
    <button class="btn btn-sm" onclick="document.documentElement.classList.toggle('dark')">
      Toggle dark <span class="kbd">D</span>
    </button>
  </body>
</html>
