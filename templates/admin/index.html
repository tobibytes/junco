<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Admin</title>
    <meta name="description" content="An admin panel built with Junco." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet" />
    <!-- Applies the saved theme before first paint (same code as themeScript() from @junco/react/server). -->
    <script>
      (function(k,t,m){try{var s=localStorage;t=s.getItem(k+"-theme")||t;m=s.getItem(k+"-motion")||m}catch(e){}var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches),r=d?"dark":"light",e=document.documentElement;e.classList.toggle("dark",d);e.dataset.theme=r;e.dataset.motion=m;e.style.colorScheme=r})("acme-admin","system","full")
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
